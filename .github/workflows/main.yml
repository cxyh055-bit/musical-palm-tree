name: Build Labi APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q -o Labi-Android-Ready.zip -d project

      - name: Find project folder
        id: find
        run: |
          P=$(find project -maxdepth 3 -name package.json -not -path "*/node_modules/*" | head -1)
          if [ -z "$P" ]; then echo "package.json not found"; ls -R | head -50; exit 1; fi
          echo "dir=$(dirname "$P")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install and build web
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          npm install
          npm run build

      - name: Create Android project
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Labi-debug-APK
          path: ${{ steps.find.outputs.dir }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
